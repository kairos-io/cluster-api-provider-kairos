#cloud-config

hostname: kairos-node-0
install:
  auto: true
  device: /dev/sda
  reboot: true

users:
- name: kairos
  passwd: test-password
  groups:
    - admin
    - users
  ssh_authorized_keys:
    - github:octocat
    - ssh-ed25519 AAAATESTKEYtestexample test@example
- name: capk
  groups: [users, admin]

# Worker node configuration
k3s-agent:
  enabled: true
  args:
    - --server https://10.0.0.42:6443
    - --token-file /etc/rancher/k3s/token
write_files:
  - path: /system/oem/12_kairos-capi-persistency.yaml
    permissions: "0644"
    owner: root
    group: root
    content: |
      name: "Kairos CAPI persistent state paths"
      stages:
        rootfs:
          - environment_file: /run/cos/extra-layout.env
            environment:
              PERSISTENT_STATE_PATHS: "/etc/cni /etc/k0s /etc/kubernetes /etc/rancher /etc/ssh /etc/systemd /var/lib/cni /var/lib/containerd /var/lib/k0s /var/lib/kubelet /var/lib/rancher /var/log"
  # systemd drop-in: skip k3s.service on the Kairos live installer.
  # The k3s.enabled: true cloud-config primitive (below) issues
  # `systemctl start k3s.service`. On the live installer, k3s's bundled
  # containerd cannot use the overlayfs snapshotter on the live tmpfs
  # overlay (cannot nest overlayfs), so k3s.service stays in retry
  # forever — blocking provider-kairos's k3s primitive from returning
  # and hanging the userdata cloud-config stage indefinitely. The
  # ConditionKernelCommandLine=!cdroot gate makes systemd treat the
  # start as a no-op on the live installer; the install proceeds, then
  # the installed-system boot has /var/lib/rancher on a real
  # filesystem (no overlay nesting) and k3s starts normally.
  # KD-3b lab finding on Hadron, harmless on Ubuntu-Kairos.
  - path: /etc/systemd/system/k3s.service.d/00-skip-on-live-installer.conf
    permissions: "0644"
    owner: root
    group: root
    content: |
      [Unit]
      ConditionKernelCommandLine=!cdroot
  - path: /etc/rancher/k3s/token
    permissions: "0644"
    content: |
      k3s-join-token
  - path: /usr/local/etc/hostname
    permissions: "0644"
    owner: root
    group: root
    content: |
      kairos-node-0
  - path: /etc/systemd/system/kairos-k3s-post-bootstrap.service
    permissions: "0644"
    owner: root
    group: root
    content: |
      [Unit]
      Description=Kairos k3s post-bootstrap tasks
      # Skip on Kairos live installer (cdroot present in cmdline) — the
      # post-bootstrap script would block for 7+ minutes waiting for k3s
      # node registration that never happens on the installer (overlayfs
      # snapshotter cannot nest on the live tmpfs overlay), holding up
      # cloud-init's runcmd and preventing kairos-agent from rebooting
      # into the installed system. (KD-3b lab finding on Hadron.)
      ConditionKernelCommandLine=!cdroot
      After=k3s-agent.service
      Wants=k3s-agent.service
      
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/bin/kairos-k3s-post-bootstrap.sh
      
      [Install]
      WantedBy=multi-user.target
  - path: /usr/local/bin/kairos-k3s-post-bootstrap.sh
    permissions: "0755"
    owner: root
    group: root
    content: |
      #!/bin/bash
      set -e
      # CAPK: always mark bootstrap success on script exit
      mark_bootstrap_success() {
        mkdir -p /run/cluster-api
        echo "success" > /run/cluster-api/bootstrap-success.complete
        chmod 0644 /run/cluster-api/bootstrap-success.complete
      }
      trap mark_bootstrap_success EXIT
      # Enforce hostname from cloud-config on immutable rootfs
      if [ -f /usr/local/etc/hostname ]; then
        /usr/bin/hostnamectl set-hostname "$(cat /usr/local/etc/hostname)"
        if ! grep -qE "127\.0\.1\.1[[:space:]]+$(cat /usr/local/etc/hostname)" /etc/hosts; then
          echo "127.0.1.1 $(cat /usr/local/etc/hostname)" >> /etc/hosts
        fi
      fi
      # Fallback: post-bootstrap providerID patch (same approach as k0s CAPK single-node)
      # If k3s registered with k3s://hostname, providerID is immutable and patch will fail - that's expected.
      # If node has empty providerID, patch will succeed and unblock Machine-to-Node matching.
      echo "Waiting for k3s node to be registered..."
      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
      MAX_WAIT=300
      ELAPSED=0
      while ! kubectl get node $(hostname) &>/dev/null; do
        if [ $ELAPSED -ge $MAX_WAIT ]; then
          echo "WARN: Timeout waiting for node to be registered (providerID patch skipped)"
          break
        fi
        echo "Waiting for node to be registered... (${ELAPSED}s/${MAX_WAIT}s)"
        sleep 5
        ELAPSED=$((ELAPSED + 5))
      done
      
      if kubectl get node $(hostname) &>/dev/null; then
        echo "Attempting to set providerID=kubevirt://kairos-node-0 on node $(hostname)..."
        for i in $(seq 1 30); do
          if kubectl patch node $(hostname) --type=merge -p '{"spec":{"providerID":"kubevirt://kairos-node-0"}}' 2>/dev/null; then
            echo "Successfully set providerID=kubevirt://kairos-node-0 on node $(hostname)"
            break
          fi
          # If node already has providerID (immutable), patch fails - don't retry
          CURRENT=$(kubectl get node $(hostname) -o jsonpath='{.spec.providerID}' 2>/dev/null || echo "")
          if [ -n "$CURRENT" ]; then
            echo "Node already has providerID=$CURRENT (immutable), skipping patch"
            break
          fi
          echo "Attempt $i/30: Failed to set providerID, retrying in 5 seconds..."
          sleep 5
        done
      fi

      # Mark bootstrap success for CAPI/CAPK consumers
      mkdir -p /run/cluster-api
      echo "success" > /run/cluster-api/bootstrap-success.complete
      chmod 0644 /run/cluster-api/bootstrap-success.complete
      
      echo "k3s post-bootstrap tasks completed successfully"
  
  - path: /etc/motd
    content: hello world
    permissions: "0644"
    owner: root:root
stages:
  boot:
    - name: "Ensure SSH service is enabled"
      commands:
        - systemctl enable --now sshd || systemctl enable --now ssh || true
    - name: "Ensure k3s directories exist"
      commands:
        - mkdir -p /etc/rancher/k3s
        - mkdir -p /etc/rancher/k3s/config.yaml.d
    - name: "Configure DNS resolvers for early boot"
      dns:
        nameservers:
          - 1.1.1.1
          - 8.8.8.8
        path: "/etc/resolv.conf"

runcmd:
  # `enable --now`: create the multi-user.target.wants/ symlink AND start
  # the unit on this boot. Plain `enable` only creates the symlink; the
  # service would only auto-start on the NEXT boot — too late for the
  # KD-3b push pattern, which needs to fire on the first installed-system
  # boot. Same fix the k0s templates use via the helper service.
  - /bin/systemctl daemon-reload || true
  - /bin/systemctl enable --now kairos-k3s-post-bootstrap.service || true
