#cloud-config
hostname: md-0-abcde

users:
  - name: kairos
    passwd: kairos
    groups:
      - admin

stages:
  initramfs:
    - name: pre-kubeadm
      sysctl:
        net.ipv4.ip_forward: "1"
        kernel.panic: "10"
        kernel.panic_on_oops: "1"
        vm.overcommit_memory: "1"
  boot:
    - name: "Configure DNS resolvers for early boot"
      dns:
        nameservers:
          - 1.1.1.1
          - 8.8.8.8
        path: "/etc/resolv.conf"

