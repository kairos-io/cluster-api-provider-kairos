#cloud-config

hostname: kairos-cp-0

users:
- name: kairos
  groups:
    - admin
  ssh_authorized_keys:
    - github:testuser
- name: capk
  groups: [users, admin]

# Control-plane node configuration
# ADR 0005 (HA) join node: k0s controller-join via --token-file. The token is
# produced on the init controller (k0s token create --role=controller) and
# delivered by the Phase-3 controller through .JoinToken (TOKEN-INV). The join
# target is k0s's own gossip/etcd peer discovery seeded by the token, NOT the
# VIP block. Like the init node, a joiner's api.sans in /etc/k0s/k0s.yaml MUST
# include the stable control-plane endpoint: the VIP can fail over to any member.
k0s:
  enabled: true
  args:
    # Controller-join: --token-file carries the controller-role join token.
    - --token-file=/etc/k0s/controller-token
    # ADR 0005 § D.3 (HA): run the k0s controller as a schedulable worker too, so
    # the kube-vip DaemonSet — which selects control-plane Nodes — has a Node to
    # land on. A controller-only k0s node registers no kubelet/Node, so the
    # DaemonSet would stay Pending and the VIP would never float (Phase-4 lab
    # finding). k0s auto-applies the node-role.kubernetes.io/control-plane:NoSchedule
    # taint with --enable-worker; the DaemonSet tolerates it and general workloads
    # stay off. HA + CAPV/CAPM3 only — single-node (RenderKubeVIP=false) and CAPK
    # (OQ-5) never reach this, so their rendering is byte-for-byte unchanged.
    - --enable-worker

write_files:
  - path: /system/oem/12_kairos-capi-persistency.yaml
    permissions: "0644"
    owner: root
    group: root
    content: |
      name: "Kairos CAPI persistent state paths"
      stages:
        rootfs:
          - environment_file: /run/cos/extra-layout.env
            environment:
              PERSISTENT_STATE_PATHS: "/etc/cni /etc/k0s /etc/kubernetes /etc/rancher /etc/ssh /etc/systemd /var/lib/cni /var/lib/containerd /var/lib/k0s /var/lib/kubelet /var/lib/rancher /var/log"
  # INIT-ORDERING (bare-metal lab, 2026-09-08). provider-kairos turns `k0s.args:`
  # into /etc/systemd/system/k0scontroller.service.d/override.conf, and it writes
  # that file AFTER enabling the unit. It usually wins by a fraction of a second,
  # but not always — measured across four k0s boots on identical images:
  #
  #   07:12:16.064 override / 07:12:16 start   args applied
  #   07:19:25.756 override / 07:19:25 start   args applied
  #   08:08:12.016 override / 08:08:12 start   args applied
  #   08:35:04.287 override / 08:35:01 start   args LOST  (3.3s late)
  #
  # On the boot that lost, /proc/<pid>/cmdline was a bare `k0s controller` with
  # every flag missing: no worker role, so no kubelet, so the Node never
  # registered and the whole control plane stalled. On a JOIN node the casualty
  # is the join-token flag, which is the k3s split-brain failure in k0s clothing.
  #
  # write_files lands in the boot stage, before the unit is enabled, so a drop-in
  # written here is always present at the first start. It sorts after
  # override.conf, so it wins whenever both exist and is harmless when the plugin
  # never gets there. Same belt-and-braces as the k3s 93-ha-datastore.yaml pin —
  # k0s has no config.yaml.d equivalent for CLI-only flags, so the drop-in is the
  # available mechanism. Keep this list identical to `k0s.args:` above;
  # TestHA_K0sArgsDropInMatchesK0sArgs fails the build if they drift.
  - path: /etc/systemd/system/k0scontroller.service.d/zz-capi-args.conf
    permissions: "0644"
    owner: root
    group: root
    content: |
      [Unit]
      # Never start with these arguments inside a recovery/install boot: on
      # a join node that is a real controller-join, registered as a voter,
      # that the installer then reboots out from under the cluster (measured
      # on the beskar7 lab, 2026-09-08). The bare first start cannot join —
      # it has no token and this drop-in is not loaded yet — and every start
      # that carries the token follows a reload that also loads this file.
      ConditionPathExists=!/run/cos/recovery_mode
      [Service]
      ExecStart=
      ExecStart=/usr/bin/k0s controller --token-file=/etc/k0s/controller-token --enable-worker
  - path: /etc/k0s/k0s.yaml
    permissions: "0644"
    content: |
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: k0s
      spec:
        api:
          # Per-node API advertise address, same requirement the CAPK template
          # already meets for KubeVirt masquerade. A bare-metal node is dual-homed
          # too — an isolated provisioning NIC plus a routable LAN NIC — and with
          # no api.address k0s picks one itself. Observed on the beskar7 lab
          # (2026-09-08): it chose the provisioning address, `k0s token create`
          # baked that into the controller-join token, and every joiner then failed
          # with "failed to join existing cluster via https://192.168.190.61:9443:
          # context deadline exceeded" while the join API answered perfectly well
          # on the node itself.
          #
          # The placeholder below is replaced with this node's routable address by
          # the k0scontroller ExecStartPre. It is deliberately the ONLY occurrence
          # in this file: the resolver anchors on the address line, and its
          # "already done" check keys on the same thing, so a stray copy in prose
          # would make it re-run on every boot. Leaving a placeholder in place
          # would make k0s reject the config, so when no address can be found the
          # resolver deletes this line instead (KD-55 fail-open).
          address: __API_ADDR__
          sans:
            - 192.168.1.240
        storage:
          etcd:
            # Per-node etcd peer address. The API advertise address alone is not
            # enough: members also have to reach each OTHER, and on a dual-homed
            # node k0s will otherwise peer over whichever interface it picks. Set
            # from the same routable address, resolved by the same ExecStartPre
            # before k0s starts, because etcd reads peerAddress at init/join and
            # cannot be corrected afterwards. CAPK sets both for the same reason.
            peerAddress: __ETCD_PEER_ADDR__
  - path: /usr/local/bin/kairos-k0s-api-addr.sh
    permissions: "0755"
    owner: root
    group: root
    content: |
      #!/bin/bash
      set -u

      CFG=/etc/k0s/k0s.yaml
      SENTINEL=__API_ADDR__
      PEER_SENTINEL=__ETCD_PEER_ADDR__
      ENDPOINT='192.168.1.240'

      [ -f "${CFG}" ] || exit 0
      # Idempotent: both addresses are fixed once the API and etcd have
      # initialised, and this runs on every k0s start. Anchored to the value
      # lines so nothing else in the file can keep this alive.
      if ! grep -qE "^[[:space:]]*(address|peerAddress): (${SENTINEL}|${PEER_SENTINEL})\$" "${CFG}"; then
        exit 0
      fi

      detect_addr() {
        local src dev
        # The address the kernel would use to reach the control-plane endpoint.
        # That is by definition the one joiners can reach, which is what has to
        # end up in the join token. Selected by routing, never by interface name.
        src="$(ip -4 route get "${ENDPOINT}" 2>/dev/null |
               sed -n 's/.*[[:space:]]src[[:space:]]\{1,\}\([0-9.]\{1,\}\).*/\1/p' | head -1)"
        # If the endpoint is already local — kube-vip claimed the VIP on an earlier
        # boot — the kernel answers with the VIP itself, which is not a per-node
        # address and must not be advertised as one.
        if [ -n "${src}" ] && [ "${src}" != "${ENDPOINT}" ]; then
          echo "${src}"
          return 0
        fi
        # Fall back to whichever interface carries the default route. An isolated
        # provisioning network advertises no gateway, so this lands on the routable
        # one.
        dev="$(ip -4 route show default 2>/dev/null | awk '{print $5; exit}')"
        if [ -n "${dev}" ]; then
          src="$(ip -4 -o addr show dev "${dev}" scope global 2>/dev/null |
                 awk '{print $4}' | cut -d/ -f1 | head -1)"
          if [ -n "${src}" ]; then
            echo "${src}"
            return 0
          fi
        fi
        return 1
      }

      # Bounded wait: the DHCP lease can lag the ExecStartPre by a few seconds, and
      # k0s reads this address at first init/join so it must be right by then.
      ADDR=""
      for i in $(seq 1 30); do
        ADDR="$(detect_addr || true)"
        if [ -n "${ADDR}" ]; then
          break
        fi
        echo "k0s-api-addr: waiting for a routable address (${i}/30)..."
        sleep 2
      done

      if [ -n "${ADDR}" ]; then
        sed -i "s|^\([[:space:]]*address: \)${SENTINEL}\$|\1${ADDR}|" "${CFG}"
        sed -i "s|^\([[:space:]]*peerAddress: \)${PEER_SENTINEL}\$|\1${ADDR}|" "${CFG}"
        echo "k0s-api-addr: api.address and etcd peerAddress set to ${ADDR}"
      else
        # Fail open. An unsubstituted sentinel makes k0s reject the config and
        # crash-loop, so the settings are removed instead. The two halves need
        # different surgery: an empty `api:` is re-defaulted by k0s, but an
        # empty `etcd:` is not — its storage defaulting only repairs kine, so
        # spec.storage.etcd stays nil and the etcd component dereferences it
        # at start, after `k0s config validate` has passed. The storage section
        # exists only to carry peerAddress, so drop the whole section and let
        # k0s fall back to its default etcd config. The range delete runs only
        # when its closing line is present, so it can never run to end of file.
        sed -i "/^[[:space:]]*address: ${SENTINEL}\$/d" "${CFG}"
        if grep -qE "^[[:space:]]*peerAddress: ${PEER_SENTINEL}\$" "${CFG}"; then
          sed -i "/^[[:space:]]*storage:\$/,/^[[:space:]]*peerAddress: ${PEER_SENTINEL}\$/d" "${CFG}"
        fi
        echo "k0s-api-addr: no routable address found; removed api.address and the etcd storage section, k0s will auto-detect"
      fi
  - path: /etc/systemd/system/k0scontroller.service.d/zz-capi-api-addr.conf
    permissions: "0644"
    owner: root
    group: root
    content: |
      [Service]
      ExecStartPre=/bin/sh -c '/usr/local/bin/kairos-k0s-api-addr.sh || true'
  # ADR 0005 (HA) join node: k0s controller-role join token. Sourced from
  # .JoinToken, which the Phase-3 controller produces on the init controller
  # (k0s token create --role=controller) and delivers over the node-push channel
  # (TOKEN-INV). Phase 2 renders it given the input; empty until Phase 3.
  # 0600: this is a controller-join secret on disk.
  - path: /etc/k0s/controller-token
    permissions: "0600"
    owner: root
    group: root
    content: |
      K10aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa::server:bbbbbbbbbbbbbbbbbbbbbbbb
  # ADR 0015 PR-1: a join node fails closed. k0s decides "already joined" from
  # etcd's db file (etcd/member/snap/db), which etcd creates BEFORE it has
  # validated the cluster it is joining. A join whose etcd fails in between
  # therefore leaves a db with no WAL, and the next start skips the join and
  # bootstraps a NEW cluster that shares the CA. This guard runs inside the
  # k0scontroller unit as an ExecStartPre (the mechanism of the address
  # resolver; NOT a separate unit ordered ahead of k0s, which is the ADR 0004
  # deadlock). It is static: no template input reaches it.
  - path: /usr/local/bin/kairos-k0s-join-guard.sh
    permissions: "0755"
    owner: root
    group: root
    content: |
      #!/bin/bash
      set -u
      K0S_DIR=/var/lib/k0s
      confirmed="${K0S_DIR}/.kairos-join-confirmed"
      refused="${K0S_DIR}/.kairos-join-refused"
      member="${K0S_DIR}/etcd/member"

      # A confirmed member is never touched or refused again.
      if [ -e "${confirmed}" ]; then
        exit 0
      fi

      if [ -e "${refused}" ]; then
        echo "kairos-join-guard: refusing to start k0scontroller: this node bootstrapped a cluster of its own instead of joining one. Replace the Machine (delete it); do not start k0s on this node." >&2
        exit 1
      fi

      # etcd's own "have a WAL" test: the wal dir holds at least one *.wal file.
      if [ -e "${member}/snap/db" ]; then
        have_wal=0
        for f in "${member}"/wal/*.wal; do
          if [ -e "${f}" ]; then
            have_wal=1
            break
          fi
        done
        if [ "${have_wal}" = "0" ]; then
          echo "kairos-join-guard: etcd db without a WAL: the previous join did not finish; clearing ${member} so k0s joins again"
          if ! rm -rf -- "${member}"; then
            echo "kairos-join-guard: could not clear ${member}; refusing to start k0s on it" >&2
            exit 1
          fi
        fi
      fi
      exit 0
  - path: /etc/systemd/system/k0scontroller.service.d/zz-capi-join-guard.conf
    permissions: "0644"
    owner: root
    group: root
    content: |
      [Service]
      ExecStartPre=/usr/local/bin/kairos-k0s-join-guard.sh
  # ADR 0015 PR-1: confirm the join after k0s has started. A joined node sees
  # itself plus the member that served the join (>= 2 members); only a node that
  # bootstrapped its own cluster sees exactly one. Run as the first step of
  # kairos-k0s-post-bootstrap.sh, before the providerID or any report.
  - path: /usr/local/bin/kairos-k0s-join-confirm.sh
    permissions: "0755"
    owner: root
    group: root
    content: |
      #!/bin/bash
      set -u
      K0S_DIR=/var/lib/k0s
      confirmed="${K0S_DIR}/.kairos-join-confirmed"
      refused="${K0S_DIR}/.kairos-join-refused"

      if [ -e "${confirmed}" ]; then
        exit 0
      fi
      if [ -e "${refused}" ]; then
        echo "kairos-join-guard: REFUSED earlier: this node serves a cluster of its own; not proceeding" >&2
        exit 1
      fi

      write_marker() {
        local target="$1" text="$2" tmp="$1.tmp.$$"
        if printf '%s\n' "${text}" > "${tmp}" && mv -f "${tmp}" "${target}"; then
          return 0
        fi
        rm -f "${tmp}"
        return 1
      }

      # Entries of "members" in `k0s etcd member-list` ({"members":{"<name>":"<url>"}}).
      # Prints the count, or fails when the output is not a member list.
      count_members() {
        local out body
        out="$(if command -v timeout >/dev/null 2>&1; then timeout 10 k0s etcd member-list; else k0s etcd member-list; fi 2>/dev/null)" || return 1
        out="$(printf '%s' "${out}" | tr -d ' \t\r\n')"
        case "${out}" in
          *'"members":{'*) ;;
          *) return 1 ;;
        esac
        body="$(printf '%s' "${out}" | sed -n 's/.*"members":{\(.*\)}.*/\1/p')"
        if [ -z "${body}" ]; then
          echo 0
          return 0
        fi
        # Count the keys of the members object itself: strings at depth 0 that
        # are followed by ':'. Nested values never add to the count, and
        # anything after the closing brace is ignored.
        printf '%s' "${body}" | awk '{
          s = $0; depth = 0; instr = 0; n = 0
          for (i = 1; i <= length(s); i++) {
            c = substr(s, i, 1)
            if (instr) {
              if (c == "\\") { i++ }
              else if (c == "\"") { instr = 0; if (depth == 0 && substr(s, i + 1, 1) == ":") n++ }
            } else if (c == "\"") { instr = 1 }
            else if (c == "{" || c == "[") { depth++ }
            else if (c == "}" || c == "]") { depth--; if (depth < 0) break }
          }
          print n
        }'
      }

      # A bare k0s (started before its arguments existed) is a one-member cluster
      # of its own that kairos-k0s-apply-args.sh is about to wipe and restart;
      # seeing one member there proves nothing about a join. So a one-member
      # result only counts when the SAME k0scontroller process, read before the
      # member list, is still the main PID afterwards and was started with
      # --token-file.
      main_pid() {
        local pid
        pid="$(systemctl show -p MainPID --value k0scontroller.service 2>/dev/null || echo 0)"
        if [ -z "${pid}" ] || [ "${pid}" = "0" ]; then
          echo 0
        else
          echo "${pid}"
        fi
      }
      pid_has_token() {
        [ -r "/proc/$1/cmdline" ] || return 1
        tr '\0' ' ' < "/proc/$1/cmdline" 2>/dev/null | grep -q -- '--token-file'
      }

      n=""
      for attempt in {1..120}; do
        pid_before="$(main_pid)"
        if n="$(count_members)" && [ -n "${n}" ] && [ "${n}" -ge 1 ]; then
          if [ "${n}" -ge 2 ]; then
            break
          fi
          pid_after="$(main_pid)"
          if [ "${pid_before}" != "0" ] && [ "${pid_before}" = "${pid_after}" ] && pid_has_token "${pid_after}"; then
            break
          fi
        fi
        n=""
        sleep 5
      done

      if [ -z "${n}" ]; then
        echo "kairos-join-guard: could not read the etcd member list within 10 minutes; join not confirmed, no providerID set" >&2
        exit 1
      fi
      if [ "${n}" -ge 2 ]; then
        # Fail the run when the marker cannot be written: without it a later
        # boot could refuse this node and stop a control plane that is in use.
        if ! write_marker "${confirmed}" "members=${n} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"; then
          echo "kairos-join-guard: ERROR: join looked fine (${n} etcd members) but the confirmed marker could not be written; no providerID set, replace the Machine (docs/HIGH_AVAILABILITY.md, refused joiner)" >&2
          exit 1
        fi
        echo "kairos-join-guard: join confirmed (${n} etcd members)"
        exit 0
      fi

      # Exactly one member: this node is serving a cluster of its own.
      write_marker "${refused}" "members=${n} at $(date -u +%Y-%m-%dT%H:%M:%SZ)" ||
        echo "kairos-join-guard: ERROR: could not write the refusal marker ${refused}; k0s is stopped but a restart will not be refused. Delete this Machine (docs/HIGH_AVAILABILITY.md, refused joiner)" >&2
      systemctl --no-block stop k0scontroller.service || true
      echo "kairos-join-guard: REFUSED: etcd lists only this node (${n} member); stopped k0scontroller, no providerID set. Replace the Machine." >&2
      exit 1
  # ADR 0005 § D.1 (HA) kube-vip DaemonSet + RBAC (CAPV/CAPM3 only; CAPK uses its
  # built-in LoadBalancer Service per OQ-5 and never reaches this block).
  # k0s applies manifests under /var/lib/k0s/manifests/<dir>/ via its
  # manifest-deployer (stack applier). The manifest is a multi-document set
  # (ServiceAccount + ClusterRole + ClusterRoleBinding + DaemonSet) produced by
  # kubeVIPManifest (marshaled YAML, VIP-INV-2) — no operator string is
  # concatenated into the YAML. The DaemonSet runs one kube-vip per control-plane
  # Node; the instances leader-elect on the plndr-cp-lock Lease (hence the RBAC)
  # and the leader ARPs the floating control-plane VIP, so VIP ownership fails
  # over when the leader's Node dies. Each instance elects through its own Node's
  # apiserver (127.0.0.1:6443), so a member keeps the VIP only while its own
  # apiserver can write to etcd (ADR 0014).
  - path: /var/lib/k0s/manifests/kube-vip/kube-vip.yaml
    permissions: "0644"
    owner: root
    group: root
    content: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
          name: kube-vip
          namespace: kube-system
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
          name: system:kube-vip-role
      rules:
          - apiGroups:
              - ""
            resources:
              - services
              - services/status
              - nodes
              - endpoints
            verbs:
              - get
              - list
              - watch
              - update
          - apiGroups:
              - coordination.k8s.io
            resources:
              - leases
            verbs:
              - get
              - list
              - watch
              - update
              - create
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
          name: system:kube-vip-binding
      roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: system:kube-vip-role
      subjects:
          - kind: ServiceAccount
            name: kube-vip
            namespace: kube-system
      ---
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
          name: kube-vip
          namespace: kube-system
          labels:
              app.kubernetes.io/name: kube-vip
      spec:
          selector:
              matchLabels:
                  app.kubernetes.io/name: kube-vip
          template:
              metadata:
                  labels:
                      app.kubernetes.io/name: kube-vip
              spec:
                  serviceAccountName: kube-vip
                  hostNetwork: true
                  nodeSelector:
                      node-role.kubernetes.io/control-plane: "true"
                  tolerations:
                      - key: node-role.kubernetes.io/control-plane
                        operator: Exists
                        effect: NoSchedule
                      - key: node-role.kubernetes.io/master
                        operator: Exists
                        effect: NoSchedule
                  containers:
                      - name: kube-vip
                        image: ghcr.io/kube-vip/kube-vip:v0.8.7
                        imagePullPolicy: IfNotPresent
                        args:
                          - manager
                        env:
                          - name: vip_arp
                            value: "true"
                          - name: vip_interface
                            value: eth0
                          - name: address
                            value: 192.168.1.240
                          - name: port
                            value: "6443"
                          - name: cp_enable
                            value: "true"
                          - name: svc_enable
                            value: "false"
                          - name: vip_leaderelection
                            value: "true"
                          - name: vip_leaseduration
                            value: "5"
                          - name: vip_renewdeadline
                            value: "3"
                          - name: vip_retryperiod
                            value: "1"
                          - name: bgp_enable
                            value: "false"
                          - name: KUBERNETES_SERVICE_HOST
                            value: 127.0.0.1
                          - name: KUBERNETES_SERVICE_PORT
                            value: "6443"
                        securityContext:
                          capabilities:
                              add:
                                  - NET_ADMIN
                                  - NET_RAW
          updateStrategy:
              type: RollingUpdate
  - path: /usr/local/etc/hostname
    permissions: "0644"
    owner: root
    group: root
    content: |
      kairos-cp-0
  - path: /etc/systemd/system/kairos-k0s-post-bootstrap.service
    permissions: "0644"
    owner: root
    group: root
    content: |
      [Unit]
      Description=Kairos k0s post-bootstrap tasks
      # Skip on Kairos live installer (cdroot present in cmdline): k0s node
      # registration never happens there. On a control plane the script still
      # pushes the kubeconfig, and in an HA cluster the join token and the etcd
      # status, to the management cluster once its retries run out, and on the
      # installer those would describe a throwaway cluster. (KD-3b lab finding
      # on Hadron.)
      ConditionKernelCommandLine=!cdroot
      ConditionPathExists=!/run/cos/recovery_mode
      After=k0scontroller.service
      Wants=k0scontroller.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/bin/kairos-k0s-post-bootstrap.sh

      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/kairos-k0s-post-bootstrap-enable.service
    permissions: "0644"
    owner: root
    group: root
    content: |
      [Unit]
      Description=Enable kairos-k0s-post-bootstrap service
      # Skip on live installer; pairs with the same gate on the main
      # post-bootstrap service. (KD-3b.)
      ConditionKernelCommandLine=!cdroot
      ConditionPathExists=!/run/cos/recovery_mode
      After=systemd-udev-settle.service
      Before=multi-user.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/systemctl daemon-reload
      # `enable --now`: create the multi-user.target.wants/ symlink AND
      # start the unit on this boot. After the KD-3b write_files move,
      # the main service file lands on disk during cloud-init early boot;
      # this helper runs once multi-user.target is set up and triggers
      # both enablement and immediate start of the post-bootstrap service.
      # --no-block: the post-bootstrap unit is a oneshot that can retry for
      # minutes; waiting for it would hold this helper, and runcmd with it.
      ExecStart=/bin/systemctl enable --now --no-block kairos-k0s-post-bootstrap.service
      # ADR 0005 §E.3: on HA control-plane nodes, also enable the etcd-leave
      # responder timer so the node can cleanly `k0s etcd leave` when the
      # controller requests it during a quorum-safe replacement/scale-down.
      ExecStart=/bin/systemctl enable --now kairos-etcd-leave.timer

      [Install]
      WantedBy=multi-user.target
  # ADR 0005 §E.3 (HA) k0s etcd-leave responder. During a quorum-safe
  # replacement/scale-down the controller (a) sets a CAPI pre-terminate hook on
  # this Machine and (b) writes a `leave-requested` sentinel for this member into
  # the workload-cluster kube-system/kairos-etcd-leave ConfigMap. This node-local
  # timer polls that ConfigMap via the LOCAL admin.conf (no mgmt token — the
  # node's mgmt bearer token is only valid ~24h, but replacement happens much
  # later; the local kubeconfig never expires), and on the exact sentinel runs
  # `k0s etcd leave` (which leaves THIS node — no operator/ConfigMap value is
  # ever passed as a command argument), then acks `left`. The controller then
  # clears the pre-terminate hook and CAPI terminates the VM.
  - path: /usr/local/bin/kairos-etcd-leave.sh
    permissions: "0755"
    owner: root
    group: root
    content: |
      #!/bin/bash
      set -euo pipefail
      # This member's key == the sanitized hostname, identical to the reporter's
      # key so it matches what the controller writes (the node's Kubernetes Node
      # name == NodeRef.Name). Strip hostname's trailing newline BEFORE the
      # complement-translate, or it becomes a spurious trailing '-' that no
      # longer matches NodeRef.Name.
      member_key=$(hostname | tr -d '\n' | tr -c 'a-zA-Z0-9._-' '-')
      # Read and ack through the control-plane VIP, not this node's own apiserver:
      # `k0s etcd leave` (below) removes THIS node from etcd, after which its local
      # apiserver has no backend and cannot take the ack. The VIP is not guaranteed
      # to be off this node at that moment. kube-vip moves it within about 8s once
      # its holder's apiserver stops writing to etcd (ADR 0014), and a node that
      # predates that change can keep it longer. So every call is bounded, the ack
      # is retried inside the run, and a completed leave is never re-run (below).
      # VIP.Address is render-validated (VIP-INV-3) + shquoted (VIP-INV-1); it is a
      # --server flag value, never eval'd.
      vip_addr='192.168.1.240'
      srv=(--server="https://${vip_addr}:6443")
      # Read our own leave signal from the workload ConfigMap via the VIP.
      # Absent ConfigMap/key => empty (or an unreachable endpoint) => no-op exit.
      val=$(k0s kubectl "${srv[@]}" --request-timeout=10s -n kube-system get configmap kairos-etcd-leave -o "jsonpath={.data.${member_key}}" 2>/dev/null || true)
      # Fixed sentinel, string-equality only — never eval'd, never a command arg.
      [ "${val}" = "leave-requested" ] || exit 0
      # Set once `k0s etcd leave` has run to completion. The timer fires every 30s
      # and the sentinel stays until the controller sees the ack, so without the
      # marker a run that could not ack would start `k0s etcd leave` again against
      # an etcd that is already gone, where it blocks. /run is cleared on reboot.
      leave_marker=/run/kairos-etcd-left
      if [ -e "${leave_marker}" ]; then
        echo "etcd-leave: leave already completed for ${member_key}; acking"
      else
        echo "etcd-leave: leave requested for ${member_key}; leaving etcd cluster"
        # `k0s etcd leave` (no --peer-address) leaves THIS node using its own
        # configured peer address — no ConfigMap/operator-derived value reaches the
        # command. It has no deadline of its own, so bound it with timeout(1); an
        # image without timeout(1) keeps the unbounded call. Its stderr goes to the
        # journal.
        rc=0
        if command -v timeout >/dev/null 2>&1; then
          timeout 120 k0s etcd leave || rc=$?
        else
          k0s etcd leave || rc=$?
        fi
        # Anything but a clean exit (a timeout, etcd refusing the removal, a peer
        # address that cannot be found, a config that fails to load, a missing
        # binary) leaves the membership unknown, so report nothing: no `left` and no
        # marker. The next run tries again, and if it keeps failing the controller's
        # own timeout handles the member.
        if [ "${rc}" -ne 0 ]; then
          echo "etcd-leave: k0s etcd leave failed (rc=${rc}); not acking, will retry on the next run" >&2
          exit 1
        fi
        echo "etcd-leave: left etcd cluster"
        touch "${leave_marker}"
      fi
      # Ack by patching our own key to `left` via the VIP. Only member_key
      # (locally sanitized) is interpolated; the read-back value is never reused.
      # The endpoint can still be fronted by this node for a few seconds, so retry
      # up to 24 x 5s. TimeoutStartSec on the service bounds the whole run; the
      # marker above makes the next run resume at this step.
      for attempt in {1..24}; do
        if k0s kubectl "${srv[@]}" --request-timeout=10s -n kube-system patch configmap kairos-etcd-leave --type merge \
          -p "{\"data\":{\"${member_key}\":\"left\"}}" >/dev/null 2>&1; then
          echo "etcd-leave: acked left for ${member_key}"
          exit 0
        fi
        if [ "${attempt}" -lt 24 ]; then
          echo "etcd-leave: ack attempt ${attempt}/24 failed; retrying in 5s"
          sleep 5
        fi
      done
      echo "etcd-leave: could not ack left for ${member_key}; the next run resumes at the ack" >&2
      exit 1
  - path: /etc/systemd/system/kairos-etcd-leave.service
    permissions: "0644"
    owner: root
    group: root
    content: |
      [Unit]
      Description=Kairos k0s etcd-leave responder (ADR 0005 §E.3)
      ConditionKernelCommandLine=!cdroot
      ConditionPathExists=!/run/cos/recovery_mode
      After=k0scontroller.service
      Wants=k0scontroller.service

      [Service]
      Type=oneshot
      # A oneshot unit has no start timeout by default. The script bounds each call
      # and retries the ack for about two minutes, so five minutes is a hard stop.
      TimeoutStartSec=300
      ExecStart=/usr/local/bin/kairos-etcd-leave.sh
  - path: /etc/systemd/system/kairos-etcd-leave.timer
    permissions: "0644"
    owner: root
    group: root
    content: |
      [Unit]
      Description=Poll for Kairos k0s etcd-leave requests (ADR 0005 §E.3)
      ConditionKernelCommandLine=!cdroot
      ConditionPathExists=!/run/cos/recovery_mode

      [Timer]
      OnBootSec=60
      OnUnitActiveSec=30

      [Install]
      WantedBy=timers.target
  # INIT-ORDERING (bare-metal lab, 2026-09-08). k0scontroller is enabled and
  # started before the arguments meant for it exist on disk. BOTH delivery paths
  # land afterwards: provider-kairos writes override.conf 3-4s late, and the
  # write_files drop-in lands within the same second as the start, i.e. after
  # systemd has loaded the unit. systemd picks the files up — the EFFECTIVE
  # ExecStart is correct — but the running process keeps its original argv:
  #
  #   systemctl show -p ExecStart  ->  the full, correct command line
  #   /proc/<pid>/cmdline          ->  k0s controller          (bare)
  #
  # Consequence: no worker role, so no kubelet, so the Node never registers, so
  # the providerID patch times out and the control plane stalls at 0/3 joined.
  # On a join node the missing flag is the token, and the controller initialises
  # a cluster of its own instead of joining.
  #
  # NOT the mechanism ADR 0004 removed. That one was a oneshot ordered ahead of
  # the k0s unit, which is an ordering cycle by construction and deadlocked the
  # node with the apiserver down. This runs from the post-bootstrap unit, which is
  # After=/Wants= only, and detaches the restart through systemd-run --no-block
  # so the restart job is never part of the caller's transaction. It is also a
  # no-op whenever the argv already matches, so a boot that won the race and
  # every subsequent boot are untouched.
  - path: /usr/local/bin/kairos-k0s-apply-args.sh
    permissions: "0755"
    owner: root
    group: root
    content: |
      #!/bin/bash
      set -u
      UNIT=k0scontroller.service

      pid="$(systemctl show -p MainPID --value "${UNIT}" 2>/dev/null || echo 0)"
      if [ -z "${pid}" ] || [ "${pid}" = "0" ] || [ ! -r "/proc/${pid}/cmdline" ]; then
        exit 0
      fi
      running="$(tr '\0' ' ' < "/proc/${pid}/cmdline" 2>/dev/null || true)"
      wanted="$(systemctl show -p ExecStart --value "${UNIT}" 2>/dev/null |
                sed -n 's/.*argv\[\]=\([^;]*\).*/\1/p' || true)"
      [ -n "${running}" ] && [ -n "${wanted}" ] || exit 0

      # Collapse whitespace so a formatting difference is not read as a drift.
      r="$(echo ${running})"
      w="$(echo ${wanted})"
      if [ "${r}" = "${w}" ]; then
        exit 0
      fi

      echo "k0s started before its arguments existed; applying them"
      echo "  running: ${r}"
      echo "  wanted:  ${w}"
      # A join controller that came up without its token did not join anything:
      # it initialised a cluster of its own, with its own CA and etcd. Restarting
      # with the token does not merge that away, so the state it created has to
      # go. Guarded twice over — this branch is rendered only for a JOIN node,
      # and only fires when the LIVE process is missing the token flag, i.e. one
      # that is provably not a member of the real cluster.
      #
      # bin/ holds the extracted k0s binaries and manifests/ holds the kube-vip
      # manifest that write_files put there; neither identifies a cluster, and
      # removing them would be destructive for no reason.
      #
      # ADR 0015 PR-1: never once the join is confirmed. A confirmed member holds
      # real cluster state, whatever its live argv looks like. The marker files
      # themselves are kept so the fail-closed guard still sees them.
      case "${r}" in
        *--token-file*) ;;
        *)
          if [ -e /var/lib/k0s/.kairos-join-confirmed ]; then
            echo "  join already confirmed; not discarding state"
          else
            echo "  join controller self-initialised without its token; discarding that state"
            systemctl stop "${UNIT}" || true
            find /var/lib/k0s -mindepth 1 -maxdepth 1 \
              ! -name bin ! -name manifests \
              ! -name .kairos-join-confirmed ! -name .kairos-join-refused \
              -exec rm -rf {} + 2>/dev/null || true
          fi
          ;;
      esac
      systemctl restart "${UNIT}" || true
  # ADR 0011 PR-4: the management API CA the node-push curls verify the channel
  # against (curl --cacert). Public certificate material (not secret), written
  # 0644; validated + canonically re-encoded controller-side. Never the tenant
  # workload cluster's CA.
  - path: /etc/kairos-capi/management-ca.crt
    permissions: "0644"
    owner: root
    group: root
