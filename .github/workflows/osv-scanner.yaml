name: OSV-Scanner

# Dependency vulnerability scan (OpenSSF / CNCF requirement), following the
# kairos-io org practice: Google's reusable OSV-Scanner workflow, failing on any
# known vulnerability. Results land in Security > Code scanning.
on:
  pull_request:
  push:
    branches:
      - main
  # New advisories are published against code that has not changed; rescan main
  # weekly so they surface without waiting for the next PR.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: osv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the scan jobs below are granted what the reusable
# workflows need to upload SARIF.
permissions:
  contents: read

# The reusable workflows are SHA-pinned (and SHA-pin their own actions), but their
# scanner steps pull docker://ghcr.io/google/osv-scanner-action:v2.7.0 by tag.
# Residual risk accepted for org consistency; release builds do not consume
# Actions caches (release.yaml), which bounds what a repointed image could reach.
jobs:
  # A pull request is scanned against its own base, so the check only goes red
  # for an advisory the pull request itself introduces. An advisory published
  # against code that is already on main is in both scans and cancels out.
  # Keeping the job id and name keeps the check name `osv-scanner / osv-scan`.
  scan:
    name: osv-scanner
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # Both reusable workflows default scan-args to "-r ./"; this is that plus an
      # explicit --config, so the ignore in osv-scanner.toml is applied rather
      # than left to the scanner's config discovery. It is passed to the base
      # scan and the head scan alike.
      scan-args: |-
        --config=./osv-scanner.toml
        -r
        ./

  # main, the weekly run and a manual dispatch carry the whole baseline, so an
  # advisory published against merged code surfaces here rather than on the next
  # unrelated pull request. The diff scan cannot serve them: it runs
  # `git checkout $GITHUB_BASE_REF`, which GitHub sets for pull_request only.
  scan-baseline:
    name: osv-scanner-baseline
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --config=./osv-scanner.toml
        -r
        ./
