name: Release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0-alpha.1`). The workflow:
#   1. Builds and pushes a multi-arch container image tagged with the tag name.
#   2. Renders the all-in-one provider manifest (kustomize) against that image.
#   3. Computes sha256 checksums.
#   4. Publishes a GitHub release with the manifest + checksums attached, body
#      taken from docs/release-notes/<tag>.md.
#
# Pre-conditions for a clean release:
#   * The tag must point at a commit on `main` (or a release branch) whose
#     CI is green.
#   * docs/release-notes/<tag>.md must exist in the tagged commit.
#   * The GHCR_TOKEN / GITHUB_TOKEN has packages:write to ghcr.io/kairos-io.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # create the GitHub release
  packages: write  # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      IMG_REGISTRY: ghcr.io/kairos-io/cluster-api-provider-kairos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Verify release notes exist
        run: |
          if [ ! -f "docs/release-notes/${GITHUB_REF_NAME}.md" ]; then
            echo "::error::Missing release notes file at docs/release-notes/${GITHUB_REF_NAME}.md."
            echo "::error::The release workflow requires a release-notes file per tag."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        run: |
          VERSION="${GITHUB_REF_NAME}" \
          IMG_REGISTRY="${IMG_REGISTRY}" \
          make docker-buildx-release

      - name: Resolve pushed image digest
        id: digest
        run: |
          DIGEST="$(docker buildx imagetools inspect "${IMG_REGISTRY}:${GITHUB_REF_NAME}" --format '{{.Manifest.Digest}}')"
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not resolve the pushed image digest."
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Resolved multi-arch index digest: $DIGEST"

      - name: Render release manifests (clusterctl components + flat, digest-pinned)
        run: |
          VERSION="${GITHUB_REF_NAME}" \
          IMG_REGISTRY="${IMG_REGISTRY}" \
          IMG_DIGEST="${{ steps.digest.outputs.digest }}" \
          make release-manifests

      - name: Inspect and verify rendered manifests
        run: |
          echo "== dist contents =="
          ls -la dist/
          echo "== checksums =="
          cat dist/sha256sums.txt
          echo "== controller image references (must all be @sha256 digest-pinned) =="
          grep -REn "image:.*cluster-api-provider-kairos" dist/*.yaml || true
          if grep -REh "image:.*cluster-api-provider-kairos" dist/*.yaml | grep -qv "@sha256:"; then
            echo "::error::A released manifest references the controller image without an @sha256 digest."
            grep -REn "image:.*cluster-api-provider-kairos" dist/*.yaml | grep -v "@sha256:"
            exit 1
          fi
          echo "== leftover CA-injection placeholders (should be empty) =="
          grep -REn "CERT_NAMESPACE|CERT_NAME[^=]|SERVICE_NAME[^S]|SERVICE_NAMESPACE" dist/*.yaml || echo "(none)"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          prerelease: true
          draft: false
          files: |
            dist/bootstrap-components.yaml
            dist/control-plane-components.yaml
            dist/metadata.yaml
            dist/kairos-capi-provider.yaml
            dist/sha256sums.txt
