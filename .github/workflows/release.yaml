name: Release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0-alpha.1`). The workflow:
#   1. Scans the tagged tree for known vulnerabilities and stops if any are open.
#   2. Builds and pushes a multi-arch container image tagged with the tag name,
#      with OCI labels and index annotations naming its source repository,
#      commit and version (make docker-buildx-release).
#   3. Renders the all-in-one provider manifest (kustomize) against that image.
#   4. Computes sha256 checksums.
#   5. Creates a draft GitHub release with the manifest + checksums attached,
#      body taken from docs/release-notes/<tag>.md, checks the uploaded files
#      against dist/ and the tag against the commit it built, and only then
#      publishes it. A tag that already has a published release is refused
#      before the image is built.
#
# Before any of that, the tag-gate job requires a vMAJOR.MINOR.PATCH[-PRERELEASE]
# tag name on a commit that is on `main`, and docker-buildx-release refuses to
# build the image from a tree that differs from that commit.
#
# Pre-conditions for a clean release:
#   * The tag must point at a commit on `main` whose CI is green. The tag-gate
#     job enforces the first half; nothing here checks CI.
#   * docs/release-notes/<tag>.md must exist in the tagged commit.
#   * The GHCR_TOKEN / GITHUB_TOKEN has packages:write to ghcr.io/kairos-io.

on:
  push:
    tags:
      - 'v*'

# Every job starts with no token permissions; each job grants only what it
# needs. The write grants live on the release job alone.
permissions: {}

jobs:
  # Runs first; osv and release both wait for it. It decides whether the tag is
  # a release at all, before anything is scanned, built or published:
  #
  #   * The tag name has to be vMAJOR.MINOR.PATCH, optionally with a
  #     dot-separated pre-release suffix (v0.1.0-alpha.1, v0.2.0-rc.1, and the
  #     v0.0.0-dryrun.N tags of a fork dry run). The name becomes the image tag,
  #     the release name and the release-notes path, and make expands it
  #     unquoted into recipe lines (-t $(IMG_REGISTRY):$(VERSION) and
  #     RELEASE_IMG_REF), so checking it once, here, covers every place it
  #     lands. The run: block reads it from the environment, never through
  #     ${{ }} expansion.
  #   * The tagged commit has to be on main. Release branches are not accepted.
  #     In a fork, main is the fork's own main.
  #
  # The job outputs the commit it checked, and the release job refuses to build
  # any other.
  tag-gate:
    name: release trigger gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.ancestry.outputs.commit }}
    steps:
      - name: Check the tag name
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF}" != "refs/tags/${GITHUB_REF_NAME}" ]; then
            echo "::error::This workflow releases tags only. Refusing to release."
            exit 1
          fi
          # Anchored at both ends; bash matches the whole string, not a line.
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'
          if [[ ! "${GITHUB_REF_NAME}" =~ $re ]]; then
            printf 'Tag name: %q\n' "${GITHUB_REF_NAME}"
            echo "::error::The tag name is not vMAJOR.MINOR.PATCH[-PRERELEASE]. Refusing to release."
            exit 1
          fi
          echo "Tag name ${GITHUB_REF_NAME} is a release tag."

      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 1, as in the other jobs; the next step fetches main itself
          # and relies on this clone being shallow.
          fetch-depth: 1
          persist-credentials: false

      - name: Require the tagged commit to be on main
        id: ancestry
        run: |
          # Fetch main's whole history, so the ancestry walk cannot stop at a
          # shallow boundary, and no tags. The repository is public, so the
          # fetch needs no credentials. Compare against the full ref name: a
          # tag or branch named origin/main would shadow the short name, never
          # refs/remotes/origin/main.
          git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse --verify 'HEAD^{commit}')"
          if [ "${commit}" != "$(git rev-parse --verify "${GITHUB_SHA}^{commit}")" ]; then
            echo "::error::Checked out ${commit}, not the commit the tag push named (${GITHUB_SHA}). Refusing to release."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${commit}" refs/remotes/origin/main; then
            echo "::error::The tagged commit ${commit} is not on main. Refusing to release."
            exit 1
          fi
          echo "The tagged commit ${commit} is on main."
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

  # A tag push matches none of osv-scanner.yaml's triggers (pull_request, push
  # to main, the Monday cron), and that workflow is the only whole-tree scan in
  # the repository. Without this job a release cut between two Mondays can
  # publish while an advisory is already open against an unchanged dependency,
  # with nothing red anywhere. Same scanner version and same --config as
  # osv-scanner.yaml, so the ignore list in osv-scanner.toml cannot fork between
  # the two. Both files pin the google/osv-scanner-action commit the upstream
  # release tag points to: osv-scanner.yaml calls the reusable workflows at it,
  # and this job calls the action at it. The reusable workflows call the action
  # at an ancestor commit of the same release whose osv-scanner-action/
  # directory is identical. Bump them together.
  #
  # The scan reads the tagged tree, not main: the release is what ships, and
  # everything else about this workflow is already resolved at the tag. The
  # trade-off is that an ignore added in the release commit silences this gate,
  # so a change to osv-scanner.toml is a change that wants review on its own.
  #
  # This calls the scanner action directly instead of reusing
  # osv-scanner-reusable.yml. Invoked directly and without continue-on-error, a
  # finding and a scanner error both fail the job, so an osv.dev outage, a
  # network failure or a malformed osv-scanner.toml cannot let a tag through on
  # a green gate. The scanner image maps "no package sources found" to success,
  # so the scan also writes its results to a file, and the next step fails the
  # gate when that file is missing or empty: a scan that read nothing passes
  # nothing.
  #
  # No SARIF upload, so no security-events: write. osv-scanner.yaml owns the
  # Security > Code scanning view, keyed on main; a second analysis keyed on
  # refs/tags/<tag> would add nothing a failed release job does not already say.
  osv:
    name: osv-scan (release gate)
    needs: tag-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the tagged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=./osv-scanner.toml
            --format=json
            --output=osv-results.json
            -r
            ./

      - name: Require scan results
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s osv-results.json ]; then
            echo "::error::The OSV scan produced no results file, so it scanned nothing. Refusing to release."
            exit 1
          fi
          # A completed scan always writes a JSON document with a "results"
          # array (empty when nothing is vulnerable). "No package sources
          # found" writes no file at all, which the check above catches.
          if ! jq -e 'has("results")' osv-results.json >/dev/null; then
            echo "::error::The OSV results file is not a scan result. Refusing to release."
            exit 1
          fi
          vulns=$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' osv-results.json)
          echo "OSV scan completed; ${vulns} unignored vulnerability record(s) in the results."

  release:
    needs: [tag-gate, osv]
    runs-on: ubuntu-latest
    # Deployment protection rules (required reviewers, which refs may deploy)
    # are configured on the environment in the repository settings, not here.
    # A job that names an environment the repository does not have creates it
    # on first use, without protection rules: in a fork dry run the release
    # then runs as before, with nothing to approve.
    environment: release
    # Runs for the same tag do not overlap: two at once would upload to the
    # same draft release and push the same image tag.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write  # create the GitHub release
      packages: write  # push to ghcr.io
    env:
      GOTOOLCHAIN: local
      IMG_REGISTRY: ghcr.io/kairos-io/cluster-api-provider-kairos
      # The repository the image's org.opencontainers.image.source label and
      # annotation name: kairos-io/cluster-api-provider-kairos here, the fork in
      # a release dry-run on a fork.
      IMG_SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job holds contents:write and packages:write, and nothing in it
          # uses git credentials (the image tag comes from GITHUB_REF_NAME, and
          # the release steps take the token through their own input or env).
          # Keep the token out of the git config.
          persist-credentials: false

      - name: Build only the commit the gate checked
        env:
          GATED_COMMIT: ${{ needs.tag-gate.outputs.commit }}
        run: |
          head="$(git rev-parse --verify 'HEAD^{commit}')"
          if [ -z "${GATED_COMMIT}" ] || [ "${head}" != "${GATED_COMMIT}" ]; then
            echo "::error::Checked out ${head}, but the tag gate checked '${GATED_COMMIT}'. Refusing to release."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          # A release must build from the tagged tree alone. setup-go restores
          # the module and build caches by default, and this job builds the
          # kustomize and controller-gen that render and checksum the published
          # dist/*.yaml, so a stale or poisoned cache entry would reach the
          # released artefacts.
          cache: false

      - name: Verify release notes exist
        run: |
          if [ ! -f "docs/release-notes/${GITHUB_REF_NAME}.md" ]; then
            echo "::error::Missing release notes file at docs/release-notes/${GITHUB_REF_NAME}.md."
            echo "::error::The release workflow requires a release-notes file per tag."
            exit 1
          fi

      - name: Refuse a tag that is already released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This job does not change a published release, and stops here before
          # it pushes the image tag again. GitHub returns a release by its tag
          # only once it is published: a draft left by an earlier attempt
          # answers 404, and the job goes on to upload to that draft.
          if out="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.html_url' 2>&1)"; then
            echo "::error::${GITHUB_REF_NAME} is already published at ${out}. Release a new version instead."
            exit 1
          fi
          case "${out}" in
            *"(HTTP 404)"*)
              echo "${GITHUB_REF_NAME} has no published release yet." ;;
            *)
              echo "::error::Could not check for an existing release of ${GITHUB_REF_NAME}: ${out}"
              exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        # The target fails before docker runs if manifests, generate, fmt or vet
        # leave the tree different from the checked-out commit.
        run: |
          VERSION="${GITHUB_REF_NAME}" \
          IMG_REGISTRY="${IMG_REGISTRY}" \
          make docker-buildx-release

      - name: Resolve pushed image digest
        id: digest
        run: |
          DIGEST="$(docker buildx imagetools inspect "${IMG_REGISTRY}:${GITHUB_REF_NAME}" --format '{{.Manifest.Digest}}')"
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not resolve the pushed image digest."
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Resolved multi-arch index digest: $DIGEST"

      - name: Render release manifests (clusterctl components + flat, digest-pinned)
        env:
          IMG_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          VERSION="${GITHUB_REF_NAME}" \
          IMG_REGISTRY="${IMG_REGISTRY}" \
          IMG_DIGEST="${IMG_DIGEST}" \
          make release-manifests

      - name: Require the tree to still match the tagged commit
        run: |
          # release-manifests regenerates the CRDs, RBAC and webhook manifests
          # before it renders them. docker-buildx-release already checked the
          # same regeneration before the image push; this repeats the check on
          # the tree the YAML was rendered from. A difference means the
          # published YAML is not the YAML in the tagged commit. dist/ is
          # ignored.
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "${status}" ]; then
            echo "::error::make release-manifests changed the working tree. Refusing to release."
            git status --short --untracked-files=all
            git --no-pager diff
            exit 1
          fi

      - name: Inspect and verify rendered manifests
        run: |
          echo "== dist contents =="
          ls -la dist/
          echo "== checksums =="
          cat dist/sha256sums.txt
          echo "== controller image references (must all be @sha256 digest-pinned) =="
          grep -REn "image:.*cluster-api-provider-kairos" dist/*.yaml || true
          if grep -REh "image:.*cluster-api-provider-kairos" dist/*.yaml | grep -qv "@sha256:"; then
            echo "::error::A released manifest references the controller image without an @sha256 digest."
            grep -REn "image:.*cluster-api-provider-kairos" dist/*.yaml | grep -v "@sha256:"
            exit 1
          fi
          echo "== leftover CA-injection placeholders (should be empty) =="
          grep -REn "CERT_NAMESPACE|CERT_NAME[^=]|SERVICE_NAME[^S]|SERVICE_NAMESPACE" dist/*.yaml || echo "(none)"

      - name: Create the GitHub release as a draft
        id: gh-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          # Pre-release tags carry a suffix (-alpha.N, -beta.N, -rc.N) and publish
          # as GitHub pre-releases; a clean vX.Y.Z tag (e.g. the v0.1.0 GA) publishes
          # as a full release so it surfaces as "Latest release" instead of being
          # hidden as a preview.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Every release, pre-release or not, is created as a draft and left one;
          # the next step publishes it. With immutable releases GitHub accepts
          # asset uploads only before a release is published, and with
          # draft: false this action publishes a pre-release first and uploads to
          # it after. A re-run of the job finds the draft by its tag and uploads
          # to it again.
          draft: true
          # Every path below is a release asset clusterctl or a user downloads. The
          # action's default is to warn and publish without a file it cannot find,
          # which would ship a release missing its components or checksums; fail
          # the job instead.
          fail_on_unmatched_files: true
          files: |
            dist/bootstrap-components.yaml
            dist/control-plane-components.yaml
            dist/metadata.yaml
            dist/kairos-capi-provider.yaml
            dist/sha256sums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.gh-release.outputs.id }}
          GATED_COMMIT: ${{ needs.tag-gate.outputs.commit }}
        run: |
          set -o pipefail
          # Once a release is published with immutable releases on, its files and
          # tag can no longer change. Publish only a draft of this tag whose files
          # are exactly the ones in dist/, compared by name and sha256 digest.
          # A missing or mismatched file fails here and leaves the draft as it
          # is; re-running the job uploads to the same draft and checks again.
          if [[ ! "${RELEASE_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::The release step returned no release id ('${RELEASE_ID}'). Refusing to publish."
            exit 1
          fi
          api="repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          release="$(gh api "${api}")"
          tag="$(jq -r '.tag_name' <<<"${release}")"
          draft="$(jq -r '.draft' <<<"${release}")"
          if [ "${tag}" != "${GITHUB_REF_NAME}" ] || [ "${draft}" != "true" ]; then
            echo "::error::Release ${RELEASE_ID} is not a draft of ${GITHUB_REF_NAME} (tag '${tag}', draft ${draft}). Refusing to publish."
            exit 1
          fi
          expected="$(cd dist && sha256sum -- * | awk '{ print "sha256:" $1 "  " $2 }' | LC_ALL=C sort)"
          uploaded="$(jq -r '.assets[] | "\(.digest)  \(.name)"' <<<"${release}" | LC_ALL=C sort)"
          if [ -z "${expected}" ] || [ "${uploaded}" != "${expected}" ]; then
            echo "::error::The draft's files differ from dist/. Refusing to publish."
            echo "== dist/ (expected) =="
            echo "${expected}"
            echo "== draft release ${RELEASE_ID} =="
            echo "${uploaded}"
            exit 1
          fi
          # Publishing fixes the tag to the commit it names at that moment.
          # Require that to be the commit the tag gate checked and this job
          # built: a re-run builds the commit of the original push, wherever
          # the tag points now. Annotated tags are followed to their commit.
          obj="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type + " " + .object.sha')"
          while [ "${obj%% *}" = "tag" ]; do
            obj="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${obj#* }" --jq '.object.type + " " + .object.sha')"
          done
          if [ -z "${GATED_COMMIT}" ] || [ "${obj}" != "commit ${GATED_COMMIT}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} names '${obj}', not the commit this job built ('${GATED_COMMIT}'). Refusing to publish."
            exit 1
          fi
          # The same request the release action makes when it publishes a draft
          # itself. make_latest is left to GitHub's default, so a full release
          # becomes "Latest release" and a pre-release does not, as before.
          published="$(gh api -X PATCH "${api}" -F draft=false)"
          # The response is the release as published. Fail if it is not this
          # tag, is still a draft, or lists other files than the ones checked
          # above.
          now="$(jq -r '.assets[] | "\(.digest)  \(.name)"' <<<"${published}" | LC_ALL=C sort)"
          state="$(jq -r '.tag_name + " " + (.draft | tostring)' <<<"${published}")"
          if [ "${state}" != "${GITHUB_REF_NAME} false" ] || [ "${now}" != "${expected}" ]; then
            echo "::error::Release ${RELEASE_ID} was published, but not as checked above (${state}). Check it before announcing the release."
            echo "== published files =="
            echo "${now}"
            exit 1
          fi
          jq -r '"Published \(.html_url) (prerelease: \(.prerelease), immutable: \(.immutable))"' <<<"${published}"
