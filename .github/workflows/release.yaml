name: Release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0-alpha.1`). The workflow:
#   1. Scans the tagged tree for known vulnerabilities and stops if any are open.
#   2. Builds and pushes a multi-arch container image tagged with the tag name.
#   3. Renders the all-in-one provider manifest (kustomize) against that image.
#   4. Computes sha256 checksums.
#   5. Publishes a GitHub release with the manifest + checksums attached, body
#      taken from docs/release-notes/<tag>.md.
#
# Pre-conditions for a clean release:
#   * The tag must point at a commit on `main` (or a release branch) whose
#     CI is green.
#   * docs/release-notes/<tag>.md must exist in the tagged commit.
#   * The GHCR_TOKEN / GITHUB_TOKEN has packages:write to ghcr.io/kairos-io.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # create the GitHub release
  packages: write  # push to ghcr.io

jobs:
  # A tag push matches none of osv-scanner.yaml's triggers (pull_request, push
  # to main, the Monday cron), and that workflow is the only whole-tree scan in
  # the repository. Without this job a release cut between two Mondays can
  # publish while an advisory is already open against an unchanged dependency,
  # with nothing red anywhere. Same scanner version and same --config as
  # osv-scanner.yaml, so the ignore list in osv-scanner.toml cannot fork between
  # the two. The two pins are different SHAs of google/osv-scanner-action for
  # the same release: osv-scanner.yaml pins the reusable workflow, this job pins
  # the action that workflow itself calls. Bump them together.
  #
  # The scan reads the tagged tree, not main: the release is what ships, and
  # everything else about this workflow is already resolved at the tag. The
  # trade-off is that an ignore added in the release commit silences this gate,
  # so a change to osv-scanner.toml is a change that wants review on its own.
  #
  # This calls the scanner action directly instead of reusing
  # osv-scanner-reusable.yml. Invoked directly and without continue-on-error, a
  # finding and a scanner error both fail the job, so an osv.dev outage, a
  # network failure or a malformed osv-scanner.toml cannot let a tag through on
  # a green gate.
  #
  # No SARIF upload, so no security-events: write. osv-scanner.yaml owns the
  # Security > Code scanning view, keyed on main; a second analysis keyed on
  # refs/tags/<tag> would add nothing a failed release job does not already say.
  osv:
    name: osv-scan (release gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the tagged tree
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@0a65f82af05cd58cf587827b0bb0489548c18346 # v2.7.0
        with:
          scan-args: |-
            --config=./osv-scanner.toml
            -r
            ./

  release:
    needs: osv
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      IMG_REGISTRY: ghcr.io/kairos-io/cluster-api-provider-kairos
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          # A release must build from the tagged tree alone. setup-go restores
          # the module and build caches by default, and this job builds the
          # kustomize and controller-gen that render and checksum the published
          # dist/*.yaml, so a stale or poisoned cache entry would reach the
          # released artefacts.
          cache: false

      - name: Verify release notes exist
        run: |
          if [ ! -f "docs/release-notes/${GITHUB_REF_NAME}.md" ]; then
            echo "::error::Missing release notes file at docs/release-notes/${GITHUB_REF_NAME}.md."
            echo "::error::The release workflow requires a release-notes file per tag."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        run: |
          VERSION="${GITHUB_REF_NAME}" \
          IMG_REGISTRY="${IMG_REGISTRY}" \
          make docker-buildx-release

      - name: Resolve pushed image digest
        id: digest
        run: |
          DIGEST="$(docker buildx imagetools inspect "${IMG_REGISTRY}:${GITHUB_REF_NAME}" --format '{{.Manifest.Digest}}')"
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not resolve the pushed image digest."
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Resolved multi-arch index digest: $DIGEST"

      - name: Render release manifests (clusterctl components + flat, digest-pinned)
        run: |
          VERSION="${GITHUB_REF_NAME}" \
          IMG_REGISTRY="${IMG_REGISTRY}" \
          IMG_DIGEST="${{ steps.digest.outputs.digest }}" \
          make release-manifests

      - name: Inspect and verify rendered manifests
        run: |
          echo "== dist contents =="
          ls -la dist/
          echo "== checksums =="
          cat dist/sha256sums.txt
          echo "== controller image references (must all be @sha256 digest-pinned) =="
          grep -REn "image:.*cluster-api-provider-kairos" dist/*.yaml || true
          if grep -REh "image:.*cluster-api-provider-kairos" dist/*.yaml | grep -qv "@sha256:"; then
            echo "::error::A released manifest references the controller image without an @sha256 digest."
            grep -REn "image:.*cluster-api-provider-kairos" dist/*.yaml | grep -v "@sha256:"
            exit 1
          fi
          echo "== leftover CA-injection placeholders (should be empty) =="
          grep -REn "CERT_NAMESPACE|CERT_NAME[^=]|SERVICE_NAME[^S]|SERVICE_NAMESPACE" dist/*.yaml || echo "(none)"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          # Pre-release tags carry a suffix (-alpha.N, -beta.N, -rc.N) and publish
          # as GitHub pre-releases; a clean vX.Y.Z tag (e.g. the v0.1.0 GA) publishes
          # as a full release so it surfaces as "Latest release" instead of being
          # hidden as a preview.
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
          files: |
            dist/bootstrap-components.yaml
            dist/control-plane-components.yaml
            dist/metadata.yaml
            dist/kairos-capi-provider.yaml
            dist/sha256sums.txt
