# Reduce the shared 2+2 webhook manifests to the control-plane provider's
# webhooks. Strategic-merge $patch: delete keys on webhook `name`. Removes the 2
# bootstrap webhooks, leaving mkairoscontrolplane.kb.io + mkairoscontrolplane-
# template.kb.io (mutating) and vkairoscontrolplane.kb.io + vkairoscontrol-
# planetemplate.kb.io (validating) — two per config. failurePolicy: Fail and
# sideEffects: None on the survivors are untouched.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- name: mkairosconfig.kb.io
  $patch: delete
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- name: vkairosconfig.kb.io
  $patch: delete
