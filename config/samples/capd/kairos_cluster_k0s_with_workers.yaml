# IMPORTANT: replace `password:` below with a strong value before applying.
# `openssl rand -base64 32` is fine. Inline UserPassword in KairosConfig is
# deprecated; this Secret pattern is the recommended way to provide it.
# Both KairosConfigTemplates (control plane and workers) reference this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: kairos-user-password
  namespace: default
type: Opaque
stringData:
  password: REPLACE_WITH_A_STRONG_PASSWORD
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: kairos-cluster
  namespace: default
spec:
  infrastructureRef:
    # Note: In v1beta2, use apiGroup instead of apiVersion
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: DockerCluster
    name: kairos-cluster
  controlPlaneRef:
    # Note: In v1beta2, use apiGroup instead of apiVersion
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KairosControlPlane
    name: kairos-control-plane
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DockerCluster
metadata:
  name: kairos-cluster
  namespace: default
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KairosControlPlane
metadata:
  name: kairos-control-plane
  namespace: default
spec:
  replicas: 1
  # Pin a version your Kairos image bundles; the value is informational
  # (KD-24 makes this advisory in alpha-2).
  version: "v1.30.0+k0s.0"
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: DockerMachineTemplate
      name: kairos-control-plane-template
      namespace: default
  kairosConfigTemplate:
    name: kairos-config-template-control-plane
    # Note: namespace defaults to the same namespace as KairosControlPlane
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DockerMachineTemplate
metadata:
  name: kairos-control-plane-template
  namespace: default
spec:
  template:
    # `spec` is required and must be an object. Leaving it as comments alone
    # makes it null, which the API server rejects with
    # "spec.template.spec: Required value", so keep the explicit `{}`.
    spec: {}
    # CAPD runs each machine as a container and picks the node image itself.
    # To override it, replace the line above with:
    #   spec:
    #     customImage: "<registry>/<node-image>:<pinned-tag>"
    # Do not use :latest — pin an explicit tag so re-applying this manifest
    # later does not silently change the image. Note this is CAPD's node
    # container image, not a Kairos OS image: CAPD exists to exercise the
    # Cluster API contract, and the quickstarts for CAPV, CAPK, CAPM3, and the
    # Kairos fleet provider are the paths that boot real Kairos nodes.
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KairosConfigTemplate
metadata:
  name: kairos-config-template-control-plane
  namespace: default
spec:
  template:
    spec:
      role: control-plane
      distribution: k0s
      kubernetesVersion: "v1.30.0+k0s.0"
      userName: kairos
      # Password comes from a Secret (defined at the top of this file).
      # Alternative: set `sshPublicKey:` and omit `userPasswordSecretRef`.
      userPasswordSecretRef:
        name: kairos-user-password
      userGroups:
        - admin
      # Optional: Add GitHub user for SSH access
      # githubUser: "your-github-username"
---
# Worker node deployment
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: kairos-worker-pool
  namespace: default
spec:
  clusterName: kairos-cluster
  replicas: 2
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: kairos-cluster
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: kairos-cluster
    spec:
      clusterName: kairos-cluster
      bootstrap:
        configRef:
          # In v1beta2 these are contract-versioned references: apiGroup, kind
          # and name only. An apiVersion or namespace here is rejected with
          # "strict decoding error: unknown field ...". The referenced object
          # is always resolved in the MachineDeployment's own namespace.
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KairosConfigTemplate
          name: kairos-config-template-worker
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: DockerMachineTemplate
        name: kairos-worker-template
      version: "v1.30.0+k0s.0"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DockerMachineTemplate
metadata:
  name: kairos-worker-template
  namespace: default
spec:
  template:
    # Required and must be an object; see the control-plane template above,
    # including the tag-pinning note.
    spec: {}
    # To override CAPD's node container image:
    #   spec:
    #     customImage: "<registry>/<node-image>:<pinned-tag>"
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KairosConfigTemplate
metadata:
  name: kairos-config-template-worker
  namespace: default
spec:
  template:
    spec:
      role: worker
      distribution: k0s
      kubernetesVersion: "v1.30.0+k0s.0"
      userName: kairos
      # Password comes from a Secret (defined at the top of this file).
      # Alternative: set `sshPublicKey:` and omit `userPasswordSecretRef`.
      userPasswordSecretRef:
        name: kairos-user-password
      userGroups:
        - admin
      # Worker token via Secret (recommended for production)
      workerTokenSecretRef:
        name: kairos-worker-token
        key: token
        namespace: default
      # Alternative: inline token (for development only)
      # workerToken: "your-worker-token-here"
      # Optional: Add GitHub user for SSH access
      # githubUser: "your-github-username"
---
# Secret containing worker join token
# In production, this should be created securely, e.g., from k0s token command:
# k0s token create --role=worker > worker-token.txt
apiVersion: v1
kind: Secret
metadata:
  name: kairos-worker-token
  namespace: default
type: Opaque
stringData:
  token: "CHANGE_ME_WITH_ACTUAL_K0S_WORKER_TOKEN"
  # To get a worker token from an existing k0s cluster:
  # kubectl exec -n kube-system <k0s-controller-pod> -- k0s token create --role=worker

