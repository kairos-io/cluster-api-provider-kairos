# ============================================================================
# Fleet Sample: k3s Control Plane + Worker on Kairos OS
# (KairosFleetMachine infrastructure)
# ============================================================================
#
# This manifest creates one control-plane machine plus a 1-replica worker
# MachineDeployment, using the Kairos bootstrap and control-plane providers
# with KairosFleetMachine infrastructure. The control plane clones the
# KairosFleetMachineTemplate into a KairosFleetMachine per Machine. See
# docs/QUICKSTART_FLEET.md.
#
# For the k0s variant see kairos_cluster_k0s_with_workers.yaml in this
# directory (same shape; only the distribution, version and worker-token
# fields differ). k3s has no k0sSingleNode equivalent: a single-node k3s
# control plane already accepts worker joins. kairos_cluster_k0s_single_node.yaml
# shows the standalone-node case, which is k0s only.
#
# PREREQUISITES (all must be satisfied before applying this manifest):
#
#   1. Cluster API core v1.13.4+ installed on the management cluster.
#
#   2. The Kairos bootstrap and control-plane providers (this repo) installed
#      as described in docs/INSTALL.md, plus the Kairos fleet infrastructure
#      provider that serves the KairosFleetCluster, KairosFleetMachine and
#      KairosFleetMachineTemplate kinds.
#
#   3. The KairosFleetCluster and KairosFleetMachineTemplate objects below
#      (and any Secret they reference) belong to the Kairos fleet
#      infrastructure provider. Fill them in as that provider requires.
#      Values marked TODO must be supplied by you.
#
#   4. Control-plane nodes must be able to reach the management cluster's API
#      server: they push their kubeconfig to a staging Secret there. Set
#      KAIROS_MANAGEMENT_API_OVERRIDE on the bootstrap provider's Deployment
#      to a URL the nodes can reach; see docs/INSTALL.md, "Set the URL the
#      nodes push to".
#
#   5. A strong user password. The Secret at the top of this file holds a
#      placeholder; replace it before applying (see the comment on it).
#
#   6. A worker join token Secret (fleet-demo-k3s-token below). The
#      placeholder value must be replaced; see the comment on it.
#
# APPLY:
#   kubectl apply -f config/samples/fleet/kairos_cluster_k3s_with_workers.yaml
#
# ============================================================================
#
# SCOPE: a single control-plane machine (replicas: 1) plus a worker
# MachineDeployment, the validated topology. HA (KairosControlPlane
# spec.replicas: 3 or 5) is not exercised with KairosFleetMachine
# infrastructure and no HA sample is shipped. See docs/HIGH_AVAILABILITY.md.
#
# NO install: block anywhere below. The rendered cloud-config is applied to a
# node that already runs Kairos; do not add an install: block to a
# KairosConfigTemplate in this file.
#
# ============================================================================

# IMPORTANT: replace `password:` below with a strong value before applying
# (`openssl rand -base64 32` generates one), or delete this document and
# create the Secret out of band instead. Do not set userPassword inline in a
# KairosConfig; userPasswordSecretRef is the supported form. Both
# KairosConfigTemplates (control plane and worker) below reference this
# Secret.
apiVersion: v1
kind: Secret
metadata:
  name: kairos-user-password
  namespace: default
type: Opaque
stringData:
  password: REPLACE_WITH_A_STRONG_PASSWORD
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: fleet-demo
  namespace: default
spec:
  # Optional: adjust to match your CNI/service-network configuration, or omit
  # this block entirely to use your CNI's defaults.
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.0.0/16
    services:
      cidrBlocks:
        - 10.128.0.0/12
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: KairosFleetCluster
    name: fleet-demo
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KairosControlPlane
    name: fleet-demo-control-plane
  # spec.controlPlaneEndpoint is left unset here. Until it is populated the
  # KairosControlPlane reports WaitingForInfrastructureControlPlaneEndpoint.
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KairosFleetCluster
metadata:
  name: fleet-demo
  namespace: default
spec:
  # TODO: fill in as the Kairos fleet infrastructure provider requires.
  controlPlaneEndpoint:
    host: "TODO-CONTROL-PLANE-ENDPOINT-HOST"
    port: 6443
  # TODO: the remaining values below are the fleet infrastructure provider's.
  auroraboot:
    url: "https://auroraboot.example.com:8080"
    adminTokenSecretRef:
      name: auroraboot-admin-token
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KairosControlPlane
metadata:
  name: fleet-demo-control-plane
  namespace: default
spec:
  # Single control plane only. HA (replicas: 3/5) is not exercised with this
  # infrastructure; see docs/HIGH_AVAILABILITY.md. spec.ha.vip is not set
  # because it is unnecessary for a single control-plane node.
  replicas: 1
  version: "v1.34.3+k3s3"
  # An explicit value here always wins over the KairosConfigTemplate's
  # distribution. Keep it equal to the template and to your Kairos image.
  distribution: k3s
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: KairosFleetMachineTemplate
      name: fleet-demo-control-plane
      namespace: default
  kairosConfigTemplate:
    name: fleet-demo-control-plane
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KairosFleetMachineTemplate
metadata:
  name: fleet-demo-control-plane
  namespace: default
spec:
  template:
    spec:
      # TODO: fill in as the Kairos fleet infrastructure provider requires.
      group: control-plane
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KairosConfigTemplate
metadata:
  name: fleet-demo-control-plane
  namespace: default
spec:
  template:
    spec:
      role: control-plane
      distribution: k3s
      kubernetesVersion: "v1.34.3+k3s3"
      # No install: block; see the header comment above.
      userName: kairos
      # Password comes from the Secret defined at the top of this file.
      # Alternative: set sshPublicKey: and omit userPasswordSecretRef.
      userPasswordSecretRef:
        name: kairos-user-password
      userGroups:
        - admin
      # Optional: add SSH public key for direct node access.
      # sshPublicKey: "ssh-rsa AAAAB3NzaC1yc2E..."
      # Optional: import SSH public keys from a GitHub user's profile.
      # githubUser: "your-github-username"
---
# k3s workers join the control-plane server using this token. Create it out
# of band (e.g. `k3s token create` on the control-plane node, or reuse the
# server's node-token from /var/lib/rancher/k3s/server/node-token). Do not
# commit a real token to version control.
apiVersion: v1
kind: Secret
metadata:
  name: fleet-demo-k3s-token
  namespace: default
type: Opaque
stringData:
  token: "REPLACE-WITH-K3S-JOIN-TOKEN"
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: fleet-demo-md-0
  namespace: default
spec:
  clusterName: fleet-demo
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: fleet-demo
      cluster.x-k8s.io/deployment-name: fleet-demo-md-0
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: fleet-demo
        cluster.x-k8s.io/deployment-name: fleet-demo-md-0
    spec:
      clusterName: fleet-demo
      version: "v1.34.3+k3s3"
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KairosConfigTemplate
          name: fleet-demo-md-0
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: KairosFleetMachineTemplate
        name: fleet-demo-md-0
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KairosFleetMachineTemplate
metadata:
  name: fleet-demo-md-0
  namespace: default
spec:
  template:
    spec:
      # TODO: fill in as the Kairos fleet infrastructure provider requires.
      group: workers
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KairosConfigTemplate
metadata:
  name: fleet-demo-md-0
  namespace: default
spec:
  template:
    spec:
      role: worker
      distribution: k3s
      kubernetesVersion: "v1.34.3+k3s3"
      # No install: block; see the header comment above.
      k3sTokenSecretRef:
        name: fleet-demo-k3s-token
        key: token
      userName: kairos
      userPasswordSecretRef:
        name: kairos-user-password
      userGroups:
        - admin
