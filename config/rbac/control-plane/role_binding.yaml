# Binds the control-plane manager ServiceAccount to control-plane-manager-role.
# kustomize's nameReference transformer rewrites roleRef.name and the subject
# ServiceAccount name to the overlay's namePrefixed names.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: control-plane-manager-role
subjects:
- kind: ServiceAccount
  name: manager
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: control-plane-manager-role
subjects:
- kind: ServiceAccount
  name: manager
  namespace: system
