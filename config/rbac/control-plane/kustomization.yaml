# Self-contained RBAC bundle for the control-plane provider: the generated
# control-plane-manager-role (role.yaml), the manager ServiceAccount, and the
# bindings that tie them together. Bundled as a directory kustomization so the
# config/control-plane overlay can reference it without tripping kustomize's
# root-only load restrictor.
#
# role.yaml is generated by `make manifests` (controller-gen pass 3); the other
# files are hand-authored. Do not edit role.yaml by hand.
resources:
  - role.yaml
  - service_account.yaml
  - role_binding.yaml
