# Self-contained RBAC bundle for the bootstrap provider: the generated
# bootstrap-manager-role (role.yaml), the manager ServiceAccount, and the
# bindings that tie them together. Bundled as a directory kustomization so the
# config/bootstrap overlay can reference it without tripping kustomize's
# root-only load restrictor (raw files can only be loaded from within the
# referencing kustomization's own subtree).
#
# role.yaml is generated by `make manifests` (controller-gen pass 2); the other
# files are hand-authored. Do not edit role.yaml by hand.
resources:
  - role.yaml
  - service_account.yaml
  - role_binding.yaml
